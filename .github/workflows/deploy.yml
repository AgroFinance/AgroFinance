name: CI — Build AgroFinance AI

# El despliegue lo hace Vercel automáticamente en cada push (necesita API
# routes para Kapi, que GitHub Pages no puede servir por ser estático).
# Este workflow solo valida que la app compile antes de que Vercel publique.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}

  webkit-macos:
    name: WebKit en macOS real (sin tener un Mac)
    # No hay ningún Mac físico en este equipo de desarrollo — este runner
    # de GitHub Actions es literalmente un Mac (con Xcode/simuladores de
    # iOS preinstalados), gratis dentro del cupo de minutos del repo. Es
    # el único entorno de este pipeline que puede reproducir el permiso de
    # "Archivos y Carpetas" de macOS, sospechoso del freeze de carga en
    # Mac/iPhone (ver CLAUDE.md → Bug patrón Safari/webkitdirectory).
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirmar que este runner es un Mac real
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit tests (Safari macOS + iPhone + iPad)
        run: npx playwright test
        env:
          # Sin estos dos secrets configurados en el repo, las pruebas que
          # requieren login se saltan solas (no fallan en falso) — ver el
          # test.skip en tests/e2e/upload-webkit.spec.ts. Agrégalos en
          # Settings → Secrets and variables → Actions si quieres que
          # corran de verdad contra una cuenta de prueba real.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}

      - name: Subir reporte de Playwright (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
